# CI — the repo's make gates, on GitHub's free public-repo runners.
#
# Host-side gates (py, js) run natively on ubuntu-latest: uv is
# pip-installed at the version pinned below, node/npm are preinstalled,
# and PIO_BROWSER points the browser gates at the runner's real Chrome
# (the /usr/bin/chromium snap stub prints no DevTools endpoint).
#
# Every job that runs make targets first materializes the gitignored
# third_party/pico-examples clone at the pinned commit from
# sim/gen_conf_pioexamples.py's provenance header — the conformance
# corpus (.pio sources) is parsed by the py doctests, the js golden
# generators, and the model/equiv/web self-tests alike.
#
# RTL-facing gates run inside the pinned container (container/Dockerfile,
# the same image `make`'s tools fall back to on a bare host). The image
# is pure toolchain, so it is content-addressed by the Dockerfile: an
# unchanged build context means the pushed GHCR image already exists and
# the `image` job is a no-op manifest check (~seconds). When the
# Dockerfile does change, the build (~20 min cold — yosys/boolector/
# emsdk from source) reuses the previous image's layers via the GHCR
# registry cache. Gate jobs docker login and run the image directly —
# they run the targets the repo's own way:
# docker run --rm -v $PWD:/work -w /work.
#
# Measured budgets (CI, 2026-09-06): sim+syn+audit+model 41 s,
# equiv+hyperopt 6m20s, synth 17m27s, web 1m14s; py 1m12s and js 24 s
# host-side (the Makefile's own ~10/~15 min web/synth budgets are the
# conservative local-container numbers). `formal` is the exception —
# hours-class (the sby notes record a 1:15 h single prove) and lives in
# its own workflow (formal.yml) so this fast lane's cancel-in-progress
# concurrency never kills it mid-proof.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_PICO_EXAMPLES: c81c855ffdedc825975a40ba357723a71358ddf0

jobs:
  py:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install uv==0.12.3
      # hyperopt's load_seed doctest assembles the pico-examples sources
      - run: |
          git clone https://github.com/raspberrypi/pico-examples third_party/pico-examples
          git -C third_party/pico-examples checkout $PINNED_PICO_EXAMPLES
      - run: make py

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # the C19/C34 golden generators parse the upstream .pio sources
      - run: |
          git clone https://github.com/raspberrypi/pico-examples third_party/pico-examples
          git -C third_party/pico-examples checkout $PINNED_PICO_EXAMPLES
      - run: make js
        env:
          # the runner's /usr/bin/chromium is Ubuntu's snap stub — it
          # prints no DevTools endpoint; the real Chrome stable is here
          PIO_BROWSER: /usr/bin/google-chrome

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # content-addressed by the build context: while the Dockerfile
          # is unchanged this tag already exists in GHCR and nothing
          # rebuilds (the image is pure toolchain — the gates run the
          # checked-out tree through it)
          IMAGE="ghcr.io/${{ github.repository_owner }}/vibe-pio:ci-$(sha256sum container/Dockerfile | cut -c1-16)"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker buildx create --use
          docker buildx build \
            --cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/vibe-pio:cache \
            --cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/vibe-pio:ci-main \
            --cache-to type=registry,ref=ghcr.io/${{ github.repository_owner }}/vibe-pio:cache,mode=max \
            --tag "$IMAGE" \
            --tag ghcr.io/${{ github.repository_owner }}/vibe-pio:ci-main \
            --push container/
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  sim:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # make model's asm-check parses the conformance .pio sources
      - run: |
          git clone https://github.com/raspberrypi/pico-examples third_party/pico-examples
          git -C third_party/pico-examples checkout $PINNED_PICO_EXAMPLES
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --rm -v "$PWD:/work" -w /work ${{ needs.image.outputs.image }} make sim syn audit model

  equiv:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # the hyperopt self-test reaches difftest's asm corpus
      - run: |
          git clone https://github.com/raspberrypi/pico-examples third_party/pico-examples
          git -C third_party/pico-examples checkout $PINNED_PICO_EXAMPLES
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --rm -v "$PWD:/work" -w /work ${{ needs.image.outputs.image }} make equiv hyperopt

  synth:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # the witness replay legs run the model over the corpus programs
      - run: |
          git clone https://github.com/raspberrypi/pico-examples third_party/pico-examples
          git -C third_party/pico-examples checkout $PINNED_PICO_EXAMPLES
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --rm -v "$PWD:/work" -w /work ${{ needs.image.outputs.image }} make synth

  web:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # the three-way gate's model leg parses the .pio sources
      - run: |
          git clone https://github.com/raspberrypi/pico-examples third_party/pico-examples
          git -C third_party/pico-examples checkout $PINNED_PICO_EXAMPLES
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --rm -v "$PWD:/work" -w /work ${{ needs.image.outputs.image }} make web
