# CI — the repo's make gates, on GitHub's free public-repo runners.
#
# Host-side gates (py, js) run natively on ubuntu-latest: uv is
# pip-installed at the version pinned below, node/npm and google-chrome
# (the browser gates' PATH fallback — web/tests/browser.js) are
# preinstalled on the runner image. Both read the gitignored
# third_party/pico-examples clone (the C19 golden fixtures and
# hyperopt's load_seed doctest), so they materialize it at the pinned
# commit from sim/gen_conf_pioexamples.py's provenance header.
#
# RTL-facing gates run inside the pinned container (container/Dockerfile,
# the same image `make`'s tools fall back to on a bare host): the image
# is built once per run by the `image` job into the GitHub Actions layer
# cache (~19 min cold — yosys/boolector/emsdk from source; ~2-3 min
# restored while the Dockerfile is unchanged), and each gate job
# restores it, then runs its targets the repo's own way —
# docker run --rm -v $PWD:/work -w /work.
#
# Measured budgets (in-container, 2026-09-06): sim+syn+audit+model
# ~15 min, equiv+hyperopt ~7 min, synth ~15 min, web ~10 min (the
# Makefile's own numbers for the latter two); py ~2 min and js ~15 s
# host-side. `formal` is the exception — hours-class (the sby notes
# record a 1:15 h single prove) and lives in its own workflow
# (formal.yml) so this fast lane's cancel-in-progress concurrency never
# kills it mid-proof; the weekly formal run also refreshes this lane's
# image layer cache (GHA caches evict after 7 days untouched).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  py:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install uv==0.12.3
      # hyperopt's load_seed doctest assembles the pico-examples sources
      - run: |
          git clone https://github.com/raspberrypi/pico-examples third_party/pico-examples
          git -C third_party/pico-examples checkout c81c855ffdedc825975a40ba357723a71358ddf0
      - run: make py

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # the C19/C34 golden generators parse the upstream .pio sources
      - run: |
          git clone https://github.com/raspberrypi/pico-examples third_party/pico-examples
          git -C third_party/pico-examples checkout c81c855ffdedc825975a40ba357723a71358ddf0
      - run: make js
        env:
          # the runner's /usr/bin/chromium is Ubuntu's snap stub — it
          # prints no DevTools endpoint; the real Chrome stable is here
          PIO_BROWSER: /usr/bin/google-chrome

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker buildx create --use
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag vibe-pio:ci \
            container/

  sim:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker buildx create --use
          docker buildx build \
            --cache-from type=gha \
            --tag vibe-pio:ci \
            --load container/
      - run: docker run --rm -v "$PWD:/work" -w /work vibe-pio:ci make sim syn audit model

  equiv:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker buildx create --use
          docker buildx build \
            --cache-from type=gha \
            --tag vibe-pio:ci \
            --load container/
      - run: docker run --rm -v "$PWD:/work" -w /work vibe-pio:ci make equiv hyperopt

  synth:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker buildx create --use
          docker buildx build \
            --cache-from type=gha \
            --tag vibe-pio:ci \
            --load container/
      - run: docker run --rm -v "$PWD:/work" -w /work vibe-pio:ci make synth

  web:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker buildx create --use
          docker buildx build \
            --cache-from type=gha \
            --tag vibe-pio:ci \
            --load container/
      - run: docker run --rm -v "$PWD:/work" -w /work vibe-pio:ci make web
