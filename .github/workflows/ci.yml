# CI fast lane — the gates that matter on every push: the Python
# quality gate and the JS gate including its two headless-Chromium
# browser gates (page geometry, the C25 keyboard walk). The game and
# the reading slice live in web/, so this is the lane that guards
# that work: ~1.5 min end to end, no container image involved.
#
# The heavier lanes are paths-filtered elsewhere: hdl.yml (the
# container gates over the pinned toolchain image — sim/model/equiv/
# synth/web, reading rtl/, sim/, formal/, tools/) and formal.yml (the
# hours-class sby suite). A web/-only push runs this lane and nothing
# else, plus the pages deploy.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_PICO_EXAMPLES: c81c855ffdedc825975a40ba357723a71358ddf0

jobs:
  py:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install uv==0.12.3
      # hyperopt's load_seed doctest assembles the pico-examples sources
      - run: |
          git clone https://github.com/raspberrypi/pico-examples third_party/pico-examples
          git -C third_party/pico-examples checkout $PINNED_PICO_EXAMPLES
      - run: make py

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # the C19/C34 golden generators parse the upstream .pio sources
      - run: |
          git clone https://github.com/raspberrypi/pico-examples third_party/pico-examples
          git -C third_party/pico-examples checkout $PINNED_PICO_EXAMPLES
      - run: make js
        env:
          # the runner's /usr/bin/chromium is Ubuntu's snap stub — it
          # prints no DevTools endpoint; the real Chrome stable is here
          PIO_BROWSER: /usr/bin/google-chrome
