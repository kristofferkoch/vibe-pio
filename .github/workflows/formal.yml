# The formal lane — `make formal` over every formal/*.sby task, in the
# pinned container. Split from ci.yml into its own workflow (and its
# own concurrency group) because it is hours-class: the sby notes
# record a 1:15 h single prove and the 12-task suite runs much longer,
# so the fast lane's cancel-in-progress must never kill it mid-proof —
# only a newer formal run supersedes an in-flight one. Skipped on PRs
# for the same reason (flip the `if:` for a PR that touches formal/ or
# rtl/ invariant sets); the weekly run keeps main honest and refreshes
# the image layer cache GHA evicts after 7 days untouched.
#
# The container comes from GHCR (:ci-main, pushed by ci.yml's image
# job; it is pure toolchain — the proofs read the checked-out tree via
# the bind mount). A dispatch before any ci run on main builds it here
# instead, reusing the registry layer cache.
name: formal

on:
  push:
    branches: [main]
    # the proofs read rtl/ + formal/ (the .sby scripts) and run in the
    # container image; nothing else is worth restarting hours of solving
    paths:
      - formal/**
      - rtl/**
      - sim/**
      - container/**
      - .github/workflows/formal.yml
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

permissions:
  contents: read
  packages: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Pull the toolchain image (or build it if none pushed yet)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! docker pull ghcr.io/${{ github.repository_owner }}/vibe-pio:ci-main; then
            docker buildx create --use
            docker buildx build \
              --cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/vibe-pio:cache \
              --cache-to type=registry,ref=ghcr.io/${{ github.repository_owner }}/vibe-pio:cache,mode=max \
              --tag ghcr.io/${{ github.repository_owner }}/vibe-pio:ci-main \
              --load container/
          fi
          docker tag ghcr.io/${{ github.repository_owner }}/vibe-pio:ci-main vibe-pio:ci
      - run: docker run --rm -v "$PWD:/work" -w /work vibe-pio:ci make formal
